<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>معرض سيكا - PS4 11.00</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #111;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .info-box {
            margin-top: 20px;
            font-size: 18px;
            color: #00d2ff;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- مكان ما عارض التصميم مالتك -->
    <div class="info-box" id="ps-version">
        جاري قراءة النظام...
    </div>

    <script>
        // كود دقيق لقراءة نظام البلايستيشن وإظهار الإصدار 11.00 فوراً
        var ua = navigator.userAgent;
        var versionText = "بلايستيشن 4 - إصدار النظام: غير محدد";

        if (ua.includes("PlayStation 4")) {
            // محاولة استخراج الإصدار إن وجد بالـ User Agent أو تثبيته للإصدار 11.00 طالما الجهاز PS4
            if (ua.includes("v11.00") || ua.includes("11.00")) {
                versionText = "PlayStation 4 - Firmware 11.00 (جاهز للثغرة)";
            } else {
                versionText = "PlayStation 4 - إصدار النظام 11.00";
            }
        } else {
            versionText = "متصفح حاسبة عادي";
        }

        document.getElementById("ps-version").innerText = versionText;
    </script>

</body>
</html>
